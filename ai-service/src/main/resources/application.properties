# =========================================================
# APPLICATION
# =========================================================

spring.application.name=ai-service
server.port=8088


# =========================================================
# GEMINI
# =========================================================

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite


# =========================================================
# SPRING AI TOOL CALLING
# =========================================================

spring.ai.chat.client.tool-calling.enabled=true


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always


# =========================================================
# OPEN TELEMETRY
# =========================================================

management.tracing.sampling.probability=1.0

management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces


# =========================================================
# BUSINESS SERVICES
# =========================================================

services.product.url=http://localhost:8081

#services.order.url=http://localhost:8082
#
services.inventory.url=http://localhost:8083
#
services.warehouse.url=http://localhost:8084
